# 用法:
#   mkdir -p cache
#   echo "UID=$(id -u)" >> .env && echo "GID=$(id -g)" >> .env
#   docker compose -f docker-compose.server.cpu.yml up --build
# UID/GID 走 .env(compose 会自动读取)。注意:bash 里 UID 是只读变量,
# `UID=$(id -u) docker compose ...` 这种写法会报 "UID: readonly variable"。
services:
  marker-api:
    container_name: marker-api
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu.server
    image: marker-api-cpu
    # 以宿主机用户运行,bind mount 出来的 ./cache 不需要 chown
    user: "${UID:-1001}:${GID:-1001}"
    environment:
      - HOME=/tmp
      - HF_HOME=/data/hf
      - CACHE_DIR=/data/cache
    volumes:
      - ./cache:/data
    ports:
      - "8080:8080"
